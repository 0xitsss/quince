name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Production gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly
        with:
          components: clippy, rustfmt

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ci-

      # The Criterion baseline is intentionally isolated from Cargo's build cache.
      # Bump this key only after reviewing and accepting a new performance baseline.
      - name: Restore versioned Criterion baseline
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target/criterion
          key: criterion-${{ runner.os }}-v3

      - name: cargo build
        run: cargo build --workspace --locked

      - name: release build
        run: cargo build --workspace --release --locked

      - name: public surface policy
        run: bash tools/verify_public_surface.sh

      - name: native indicator documentation contract
        run: bash tools/verify_indicator_catalogue.sh

      - name: release metadata policy
        run: bash tools/verify_release_metadata.sh

      - name: release version contract
        run: bash tools/test_verify_release_version.sh

      - name: benchmark regression contract
        run: bash tools/test_verify_benchmark_regressions.sh

      - name: cargo +nightly fmt
        run: cargo +nightly fmt --all -- --check

      - name: cargo test
        run: cargo test --workspace --lib --bins --tests --examples --locked

      - name: exchange contract fixtures
        run: cargo test -p quince-exchange --lib contract_ --locked

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings

      - name: Criterion benchmarks
        run: |
          marker="$(mktemp)"
          trap 'rm -f "$marker"' EXIT
          verify_recent_benchmarks() {
            if [ "${GITHUB_REF}" = "refs/heads/master" ]; then
              QUINCE_BENCHMARK_ALLOW_BOOTSTRAP=1 \
                bash tools/verify_benchmark_regressions.sh --since "$marker"
            else
              bash tools/verify_benchmark_regressions.sh --since "$marker"
            fi
            touch "$marker"
          }

          # Run latency-sensitive engine microbenchmarks before sustained CPU
          # load can distort frequency scaling, and gate each suite separately
          # so stale estimates can never contaminate a later decision.
          cargo bench -p quince-engine --bench bench -- --noplot
          verify_recent_benchmarks
          cargo bench -p quince-qfl --bench bench -- --noplot
          verify_recent_benchmarks
          cargo bench -p quince-indicators --bench bench -- --noplot
          verify_recent_benchmarks
