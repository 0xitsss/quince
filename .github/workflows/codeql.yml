name: "CodeQL Rust Scan on Push"


on:
  push:
    branches: [ "master" ]

jobs:
  analyze:
    name: Analyze Rust Code
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1


    - name: Initialize CodeQL
      uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
      with:
        languages: rust
        build-mode: none # disable build step since we are using cargo for Rust projects

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
      with:
        category: "/language:rust"
